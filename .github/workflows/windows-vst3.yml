name: Build Windows VST3

on:
  push:
    branches: [main]
    paths:
      - "kotoist/**"
      - "xtask/**"
      - "Cargo.toml"
      - ".cargo/**"
      - ".github/workflows/windows-vst3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build VST3 bundle
        run: cargo xtask bundle -p kotoist --release

      - name: Package VST3 for download
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path "target/bundled" -Directory -Filter "*.vst3" | Select-Object -First 1
          if (-not $bundle) { throw "No .vst3 bundle found under target/bundled" }
          Compress-Archive -Path $bundle.FullName -DestinationPath "kotoist-windows-vst3.zip" -Force

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: kotoist-windows-vst3
          path: kotoist-windows-vst3.zip
          if-no-files-found: error
          retention-days: 30

  scan:
    name: Scan Windows VST3 with ClamAV
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    steps:
      - name: Download Windows VST3 artifact
        uses: actions/download-artifact@v4
        with:
          name: kotoist-windows-vst3
          path: scan-input

      - name: Install ClamAV and update signatures
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam

      - name: Scan the packaged plugin
        run: |
          mkdir scan-input/extracted
          unzip -q scan-input/kotoist-windows-vst3.zip -d scan-input/extracted
          clamscan --recursive --infected scan-input/extracted
